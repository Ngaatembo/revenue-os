name: Revenue OS CI

on:
  push:
    branches:
      - main
      - build/lead-recovery-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Domain tests
        run: npm run test:domain
      - name: Lint
        run: npm run lint

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Replay migrations and run SQL journey and security tests
        run: ./scripts/test-db.sh
      - name: Rehearse the release migrations and their rollback on a disposable database
        run: ./scripts/rehearse-migration.sh
